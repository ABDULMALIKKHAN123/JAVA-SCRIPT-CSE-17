<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body >
         <!-- P H DIV SPAN ---- TEXT ME USE KAR  SAKTE HAIN -->
    <h1 class="text-base">ABDUL MALIK KHAN</h1>
    <p class="text-lg">ABDUL MALIK KHAN</p>
    <P class="text-2xl">ABDUL MALIK KHAN</P>
    <div class="text-4xl">ABDUL MALIK KHAN</div>
    <span class="text-8xl">ABDUL MALIK KHAN</span>


    <!-- shades of color (100-900) 100 is light and 900 is dark -->
    <p class="text-yellow-200">ABDUL MALIK KHAN</p>
    <p class="text-green-100">ABDUL MALIK KHAN</p>
    <p class="text-blue-300">ABDUL MALIK KHAN</p>
    <p class="text-red-400">ABDUL MALIK KHAN</p>
    <p class="text-black-500">ABDUL MALIK KHAN</p>
    <p class="text-gray-600">ABDUL MALIK KHAN</p>
    <p class="text-green-700">ABDUL MALIK KHAN</p>
    <p class="text-green-800">ABDUL MALIK KHAN</p>
    <p class="text-green-900">ABDUL MALIK KHAN</p>


    <body class="bg-gray-700"></body> 

        <!-- button background color and text color -->
    <button class="bg-green-500 text-white">ABDUL</button>
    <br>
    <br>

    <!-- padding (L-R px (2 to 96)) -->
     <button class="bg-green-700 text-white px-2 py-2">ABDUL</button>
     <br>
     <br>

     <!-- hover effect on button -->
      <button class="bg-red-700 hover:bg-green-800">ABDUL</button>




</body>
</html>

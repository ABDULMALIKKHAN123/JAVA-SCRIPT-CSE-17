<!DOCTYPE html>
<html>
<head>
  <title>Online Quiz System</title>
  <link rel="stylesheet" href="Online Quiz System style.css">
</head>
<body>

<div class="container">

  <h1>🌐 Online Quiz System</h1>

  <div id="quizBox">
    <h2 id="question"></h2>

    <div id="options"></div>

    <p>Time Left: <span id="timer">15</span> sec</p>
  </div>

  <div id="resultBox" style="display:none;">
    <h2>Quiz Completed 🎉</h2>
    <p id="scoreText"></p>
    <button onclick="restartQuiz()">Restart</button>
  </div>

</div>

<script src="Online Quiz System script.js"></script>
</body>
</html>
